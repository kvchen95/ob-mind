name: Sync Submodules

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时检查一次
  workflow_dispatch:  # 手动触发
  push:
    branches: [ main, master ]
    paths:
      - '.gitmodules'
      - '**/*.git'
  pull_request:
    branches: [ main, master ]

jobs:
  sync-submodules:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        submodules: recursive
        fetch-depth: 0

    - name: Setup Git Configuration
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Sync submodule URLs
      run: git submodule sync --recursive

    - name: Update submodules to latest commit
      run: |
        git submodule update --init --recursive
        git submodule update --remote --merge

    - name: Check for changes
      id: changes
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changes_detected=true" >> $GITHUB_OUTPUT
          echo "Changes detected in submodules"
          git status --porcelain
        else
          echo "changes_detected=false" >> $GITHUB_OUTPUT
          echo "No changes in submodules"
        fi

    - name: Commit and push changes
      if: steps.changes.outputs.changes_detected == 'true'
      run: |
        git add .
        git commit -m "Auto-sync submodules to latest versions
        
        - Updated submodule references to latest commits
        - This commit was automatically generated by GitHub Actions
        
        Submodule updates:
        $(git status --porcelain | grep -E 'M.*submodule' | sed 's/.*M //')"
        git push origin ${{ github.ref }}

    - name: Create Pull Request if on PR branch
      if: steps.changes.outputs.changes_detected == 'true' && github.event_name == 'pull_request'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'Auto-sync submodules to latest versions'
        title: 'Auto-sync Submodules'
        body: |
          This PR updates submodules to their latest versions.
          
          Auto-generated by GitHub Actions workflow.
        branch: auto-sync-submodules-${{ github.run_number }}

    - name: Post status comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo, number: issue_number } = context.issue;
          const message = ${{ steps.changes.outputs.changes_detected == 'true' }} ? 
            '✅ Submodules have been updated to latest versions' : 
            'ℹ️ No submodule updates were needed';
          
          await github.rest.issues.createComment({
            owner,
            repo,
            issue_number,
            body: message
          });

  notify-on-failure:
    needs: sync-submodules
    runs-on: ubuntu-latest
    if: failure()
    steps:
    - name: Notify on failure
      run: |
        echo "GitHub Actions workflow failed to sync submodules."
        echo "Please check the logs for more information."



